<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BiteRush</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="flex-between" style="padding: var(--spacing-md) 0;">
                <a href="index.html" class="logo">
                    <span style="font-size: 24px; font-weight: 700; color: var(--primary-color);">
                        🍔 BiteRush
                    </span>
                </a>
                
                <div class="navbar-menu">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="restaurants.html" class="nav-link">Restaurants</a>
                    <a href="restaurants.html" class="nav-link">Categories</a>
                    <a href="restaurants.html" class="nav-link">Offers</a>
                </div>
                
                <div class="flex-center gap-md">
                    <a href="cart.html" class="btn btn-primary btn-sm position-relative">
                        🛒
                        <span class="cart-count badge badge-primary" style="position: absolute; top: -8px; right: -8px; display: none;">0</span>
                    </a>
                    
                    <div class="auth-links flex-center gap-sm">
                        <a href="login.html" class="btn btn-outline btn-sm">Login</a>
                    </div>
                    
                    <div class="user-links flex-center gap-sm" style="display: none;">
                        <span class="user-name text-secondary"></span>
                        <button onclick="logout()" class="btn btn-outline btn-sm">Logout</button>
                    </div>
                    
                    <button class="navbar-toggle" style="display: none; background: none; border: none; font-size: 24px; cursor: pointer;">
                        ☰
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="section" style="min-height: calc(100vh - 200px); display: flex; align-items: center;">
        <div class="container">
            <div class="flex-center">
                <div class="card" style="max-width: 400px; width: 100%;">
                    <div class="card-body">
                        <div class="text-center mb-lg">
                            <h1 style="margin-bottom: var(--spacing-sm);">Welcome Back!</h1>
                            <p>Login to continue your food journey</p>
                        </div>
                        
                        <form id="login-form">
                            <div class="form-group">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="password">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                            </div>
                            
                            <div id="login-error" class="hidden mb-md" style="color: var(--danger-color); font-size: var(--font-size-sm);"></div>
                            
                            <button type="submit" class="btn btn-primary btn-block btn-lg mb-md">Login</button>
                        </form>
                        
                        <div class="text-center">
                            <p style="margin-bottom: 0;">Don't have an account? <a href="register.html" style="font-weight: 600;">Register</a></p>
                        </div>
                        
                        <hr style="margin: var(--spacing-lg) 0; border: none; border-top: 1px solid var(--border-color);">
                        
                        <!-- Demo Account Info -->
                        <div class="card" style="background: var(--bg-tertiary);">
                            <div class="card-body">
                                <h4 style="margin-bottom: var(--spacing-sm);">Demo Account</h4>
                                <p style="font-size: var(--font-size-sm); margin-bottom: var(--spacing-sm);">Use these credentials to test:</p>
                                <p style="font-size: var(--font-size-sm); margin-bottom: var(--spacing-xs);"><strong>Email:</strong> demo@biterush.com</p>
                                <p style="font-size: var(--font-size-sm); margin-bottom: 0;"><strong>Password:</strong> demo123</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" style="background-color: var(--bg-dark); color: white; padding: var(--spacing-xl) 0;">
        <div class="container">
            <div class="text-center">
                <p style="color: rgba(255,255,255,0.5);">&copy; 2026 BiteRush. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        function initLoginPage() {
            const form = document.getElementById('login-form');
            const errorElement = document.getElementById('login-error');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                
                // Validate email
                if (!validateEmail(email)) {
                    errorElement.textContent = 'Please enter a valid email address';
                    errorElement.classList.remove('hidden');
                    return;
                }
                
                // Validate password
                if (!validatePassword(password)) {
                    errorElement.textContent = 'Password must be at least 6 characters';
                    errorElement.classList.remove('hidden');
                    return;
                }
                
                // Attempt login
                const result = login(email, password);
                
                if (result.success) {
                    showToast('Login successful!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    errorElement.textContent = result.message;
                    errorElement.classList.remove('hidden');
                }
            });
            
            // Clear error on input
            document.getElementById('email').addEventListener('input', function() {
                errorElement.classList.add('hidden');
            });
            
            document.getElementById('password').addEventListener('input', function() {
                errorElement.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
