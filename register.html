<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BiteRush</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="flex-between" style="padding: var(--spacing-md) 0;">
                <a href="index.html" class="logo">
                    <span style="font-size: 24px; font-weight: 700; color: var(--primary-color);">
                        🍔 BiteRush
                    </span>
                </a>
                
                <div class="navbar-menu">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="restaurants.html" class="nav-link">Restaurants</a>
                    <a href="restaurants.html" class="nav-link">Categories</a>
                    <a href="restaurants.html" class="nav-link">Offers</a>
                </div>
                
                <div class="flex-center gap-md">
                    <a href="cart.html" class="btn btn-primary btn-sm position-relative">
                        🛒
                        <span class="cart-count badge badge-primary" style="position: absolute; top: -8px; right: -8px; display: none;">0</span>
                    </a>
                    
                    <div class="auth-links flex-center gap-sm">
                        <a href="login.html" class="btn btn-outline btn-sm">Login</a>
                    </div>
                    
                    <div class="user-links flex-center gap-sm" style="display: none;">
                        <span class="user-name text-secondary"></span>
                        <button onclick="logout()" class="btn btn-outline btn-sm">Logout</button>
                    </div>
                    
                    <button class="navbar-toggle" style="display: none; background: none; border: none; font-size: 24px; cursor: pointer;">
                        ☰
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="section" style="min-height: calc(100vh - 200px); display: flex; align-items: center;">
        <div class="container">
            <div class="flex-center">
                <div class="card" style="max-width: 400px; width: 100%;">
                    <div class="card-body">
                        <div class="text-center mb-lg">
                            <h1 style="margin-bottom: var(--spacing-sm);">Create Account</h1>
                            <p>Join BiteRush and start ordering delicious food</p>
                        </div>
                        
                        <form id="register-form">
                            <div class="form-group">
                                <label class="form-label" for="name">Full Name</label>
                                <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="password">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="confirm-password">Confirm Password</label>
                                <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your password" required>
                            </div>
                            
                            <div id="register-error" class="hidden mb-md" style="color: var(--danger-color); font-size: var(--font-size-sm);"></div>
                            
                            <button type="submit" class="btn btn-primary btn-block btn-lg mb-md">Register</button>
                        </form>
                        
                        <div class="text-center">
                            <p style="margin-bottom: 0;">Already have an account? <a href="login.html" style="font-weight: 600;">Login</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" style="background-color: var(--bg-dark); color: white; padding: var(--spacing-xl) 0;">
        <div class="container">
            <div class="text-center">
                <p style="color: rgba(255,255,255,0.5);">&copy; 2026 BiteRush. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        function initRegisterPage() {
            const form = document.getElementById('register-form');
            const errorElement = document.getElementById('register-error');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                // Validate name
                if (!validateRequired(name)) {
                    errorElement.textContent = 'Please enter your name';
                    errorElement.classList.remove('hidden');
                    return;
                }
                
                // Validate email
                if (!validateEmail(email)) {
                    errorElement.textContent = 'Please enter a valid email address';
                    errorElement.classList.remove('hidden');
                    return;
                }
                
                // Validate password
                if (!validatePassword(password)) {
                    errorElement.textContent = 'Password must be at least 6 characters';
                    errorElement.classList.remove('hidden');
                    return;
                }
                
                // Validate password confirmation
                if (password !== confirmPassword) {
                    errorElement.textContent = 'Passwords do not match';
                    errorElement.classList.remove('hidden');
                    return;
                }
                
                // Attempt registration
                const result = register(name, email, password);
                
                if (result.success) {
                    showToast('Registration successful!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    errorElement.textContent = result.message;
                    errorElement.classList.remove('hidden');
                }
            });
            
            // Clear error on input
            form.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', function() {
                    errorElement.classList.add('hidden');
                });
            });
        }
    </script>
</body>
</html>
